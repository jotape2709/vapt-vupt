name: Vapt-Vupt checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vv_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgresql://postgres:ephemeral-ci-only@localhost:5432/vv_test
      TEST_ADMIN_DATABASE_URL: postgresql://postgres:ephemeral-ci-only@localhost:5432/vv_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # o teste de compatibilidade precisa do commit da versão anterior
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Instalação reproduzível: falha se package-lock.json divergir de package.json.
      - run: npm ci
      - name: Dependency advisory report
        run: npm audit --json
      - run: npm run lint
      - run: npm run build
      - run: npm run db:migrate
      - run: npm test
      # Versão anterior (última revisada: fim do lote 3) sobre o schema desta versão. Atualize o ref a
      # cada release; ver docs/cloud/OPERACAO.md#atualização-e-reversão.
      - name: Compatibilidade da versão anterior com o schema novo
        run: bash scripts/compat-previous.sh 93d11243e61df55880f0159d39d554e5f1219481
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-and-browser-results
          path: |
            dist/
            test-results/

  # Fluxo real: Compose de desenvolvimento construído do zero (PostgreSQL 17, Keycloak 26, migração,
  # API com papel restrito), validação da instalação e testes de navegador com login no Keycloak.
  # Credenciais são as descartáveis de exemplo do compose.yaml/realm local, nunca segredos reais.
  e2e-real:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Compose do zero (build, readiness, migração, seed, provisionamento, OIDC, papéis, falhas explícitas)
        run: VV_COMPOSE_CLEAN=1 bash scripts/compose-validate.sh
      - name: Fluxo real no navegador e verificação após reiniciar PostgreSQL, Keycloak e API
        env:
          E2E_ADMIN_DATABASE_URL: postgresql://vv_migrator:dev-only-migrator@localhost:5432/vapt_vupt
          E2E_SCREENSHOTS_DIR: e2e-real-screenshots
        run: mkdir -p e2e-real-screenshots && npm run test:e2e-real
      - name: Estado e logs dos serviços
        if: always()
        run: |
          docker compose ps -a > compose-logs.txt
          docker compose logs --no-color --timestamps >> compose-logs.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-real-results
          path: |
            compose-logs.txt
            e2e-real-screenshots/
            test-results/
